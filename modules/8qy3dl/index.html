<style>
  /* ust-kup-cevir — Hover geri bildirimi renk/çizgi değil, üç boyutlu dönüş: öğeler küp yüzleri gibi devrilir (perspektif) — oyunbaz ama düzenli, teknoloji/gençlik vitrini. */
  .modulex-ust-kup-cevir { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-kup-cevir *, .modulex-ust-kup-cevir *::before, .modulex-ust-kup-cevir *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-kup-cevir :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-kup-cevir :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-kup-cevir :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-kup-cevir :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-kup-cevir img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-kup-cevir) img { height: auto; }
  .modulex-ust-kup-cevir [hidden] { display: none !important; }
  .modulex-ust-kup-cevir :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-kup-cevir :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-kup-cevir-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-kup-cevir-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-kup-cevir--bassiz .modulex-ust-kup-cevir-bas { display: none; }
  .modulex-ust-kup-cevir-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-kup-cevir-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-kup-cevir-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-kup-cevir-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-kup-cevir-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-kup-cevir-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-kup-cevir-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-kup-cevir-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-kup-cevir-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-kup-cevir { position: relative; z-index: 900; }
  .modulex-ust-kup-cevir-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-kup-cevir-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-kup-cevir-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-kup-cevir-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-kup-cevir-oge:hover, .modulex-ust-kup-cevir-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-kup-cevir-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-kup-cevir-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-kup-cevir-cta .material-symbols-outlined, .modulex-ust-kup-cevir-tel .material-symbols-outlined, .modulex-ust-kup-cevir-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-kup-cevir-tel, .modulex-ust-kup-cevir-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-kup-cevir-tel:hover, .modulex-ust-kup-cevir-posta:hover { color: --accentInk--; }
  .modulex-ust-kup-cevir-dil:empty { display: none; }
  .modulex-ust-kup-cevir-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-kup-cevir-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-kup-cevir-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-kup-cevir--acik .modulex-ust-kup-cevir-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-kup-cevir--acik .modulex-ust-kup-cevir-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-kup-cevir--acik .modulex-ust-kup-cevir-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-kup-cevir-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-kup-cevir-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-kup-cevir-sol 0.3s ease both; }
  @keyframes modulex-ust-kup-cevir-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-kup-cevir-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-kup-cevir--js .modulex-ust-kup-cevir-nav, .modulex-ust-kup-cevir--js .modulex-ust-kup-cevir-genis { display: none; }
    .modulex-ust-kup-cevir--js .modulex-ust-kup-cevir-ac { display: inline-flex; }
    .modulex-ust-kup-cevir-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-kup-cevir-in 0.3s ease both; }
    .modulex-ust-kup-cevir-pliste { display: grid; }
    .modulex-ust-kup-cevir-pliste .modulex-ust-kup-cevir-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-kup-cevir-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-kup-cevir-panel { display: none !important; }
  }
  @keyframes modulex-ust-kup-cevir-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-kup-cevir-kusak { display: flex; align-items: center; justify-content: space-between; gap: 14px 26px; padding-block: 14px; }
  .modulex-ust-kup-cevir-kupler { display: flex; flex-wrap: wrap; gap: 6px; }
  .modulex-ust-kup-cevir-kup { --kh: 44px; display: inline-grid; min-height: var(--kh); color: inherit; font-weight: 700; text-decoration: none; perspective: 500px; }
  .modulex-ust-kup-cevir-on, .modulex-ust-kup-cevir-arka { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; min-height: var(--kh); padding-inline: 16px; border-radius: 10px; white-space: nowrap; backface-visibility: hidden; transform-origin: 50% 50% calc(var(--kh) / -2); transition: transform 0.5s cubic-bezier(0.3, 0.7, 0.2, 1.2); }
  .modulex-ust-kup-cevir-on { background-color: --kartBg--; box-shadow: inset 0 -2px 0 --cizgi--; }
  .modulex-ust-kup-cevir-arka { background-color: --accent--; color: --accentText--; transform: rotateX(90deg); }
  .modulex-ust-kup-cevir-kup:hover .modulex-ust-kup-cevir-on, .modulex-ust-kup-cevir-kup:focus-visible .modulex-ust-kup-cevir-on, .modulex-ust-kup-cevir-kup[aria-current="page"] .modulex-ust-kup-cevir-on { transform: rotateX(-90deg); }
  .modulex-ust-kup-cevir-kup:hover .modulex-ust-kup-cevir-arka, .modulex-ust-kup-cevir-kup:focus-visible .modulex-ust-kup-cevir-arka, .modulex-ust-kup-cevir-kup[aria-current="page"] .modulex-ust-kup-cevir-arka { transform: none; }
  .modulex-ust-kup-cevir-genis { display: flex; align-items: center; gap: 12px; }
  @media (max-width: 1024px) {
    .modulex-ust-kup-cevir:not(.modulex-ust-kup-cevir--js) .modulex-ust-kup-cevir-kusak { flex-wrap: wrap; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kup-cevir :is(.modulex-ust-kup-cevir-baslik, .modulex-ust-kup-cevir-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kup-cevir-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-kup-cevir { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-kup-cevir *, .modulex-ust-kup-cevir *::before, .modulex-ust-kup-cevir *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-kup-cevir";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
